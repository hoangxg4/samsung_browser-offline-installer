name: Check Update & Auto Release Samsung Internet

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy mỗi 6 tiếng (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: # Vẫn cho phép bấm chạy bằng tay

# PHÂN QUYỀN BẮT BUỘC ĐỂ BOT CÓ THỂ COMMIT FILE VÀ TẠO RELEASE
permissions:
  contents: write 

jobs:
  check-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: pip install requests urllib3

      - name: 🚀 Run Checker Script
        id: updater # ID này cực quan trọng để đọc kết quả (update_found)
        run: python samsung_update.py

      # --- CÁC BƯỚC DƯỚI ĐÂY CHỈ CHẠY KHI CÓ BẢN CẬP NHẬT MỚI ---

      - name: 📝 Commit & Push version.txt
        if: steps.updater.outputs.update_found == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.txt
          git commit -m "🚀 Auto-update phiên bản v${{ steps.updater.outputs.version }}"
          git push

      - name: 🗜️ Zip the Offline Installer
        if: steps.updater.outputs.update_found == 'true'
        run: |
          # Nén file mini_installer.exe vào một file ZIP sạch sẽ để đưa lên Release
          cd Samsung_Installer_v${{ steps.updater.outputs.version }}
          zip -r ../SamsungInternet_Offline_v${{ steps.updater.outputs.version }}.zip mini_installer.exe

      - name: 🎁 Create GitHub Release
        if: steps.updater.outputs.update_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.updater.outputs.version }}
          name: "Samsung Internet Offline v${{ steps.updater.outputs.version }}"
          body: |
            🤖 **Bản phát hành tự động**
            - Phiên bản: `${{ steps.updater.outputs.version }}`
            - Trích xuất tự động từ server Omaha.
            - Gói tin chứa file cài đặt Offline gốc (`mini_installer.exe`).
          files: SamsungInternet_Offline_v${{ steps.updater.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
